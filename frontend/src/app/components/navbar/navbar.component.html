<header class="app-header">
  <div class="header-left">
    <button class="menu-btn" (click)="toggleSidebar.emit()" title="Toggle Navigation Menu" aria-label="Toggle Navigation">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <a routerLink="/dashboard" class="brand-link">
      <div class="brand-icon">🌱</div>
      <div class="brand-text">
        <span class="brand-title">HarvestHub</span>
        <span class="brand-subtitle">Farm & Crop Planner</span>
      </div>
    </a>
  </div>

  <div class="header-right" *ngIf="currentUser">
    <!-- Active User Profile Badge -->
    <div class="user-profile-badge">
      <div class="avatar">{{ currentUser.name.charAt(0).toUpperCase() }}</div>
      <div class="user-details">
        <span class="user-name">{{ currentUser.name }}</span>
        <span class="status-indicator-tag">
          <span class="status-dot-sm"></span>
          Active
        </span>
      </div>
    </div>

    <!-- Logout Action Button -->
    <button (click)="onLogout()" class="btn-logout" title="Sign Out of HarvestHub">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Logout</span>
    </button>
  </div>
</header>
