<aside class="app-sidebar" [class.open]="isOpen">
  <div class="sidebar-top">
    <div class="user-card" *ngIf="currentUser">
      <div class="avatar-lg">{{ currentUser.name.charAt(0).toUpperCase() }}</div>
      <div class="user-meta">
        <h4 class="meta-name">{{ currentUser.name }}</h4>
        <div class="meta-badge">
          <span class="status-dot"></span>
          Online
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-section">
    <span class="section-label">MAIN MENU</span>
    <nav class="nav-list">
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeSidebar.emit()" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Dashboard</span>
      </a>

      <a routerLink="/farms" routerLinkActive="active" (click)="closeSidebar.emit()" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Farms</span>
      </a>

      <a routerLink="/crop-plans" routerLinkActive="active" (click)="closeSidebar.emit()" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>Crop Plans</span>
      </a>
    </nav>
  </div>

  <div class="sidebar-section">
    <span class="section-label">AGRICULTURAL INTELLIGENCE</span>
    <nav class="nav-list">
      <a routerLink="/crops" routerLinkActive="active" (click)="closeSidebar.emit()" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a10 10 0 0 1 10 10c0 5.5-4.5 10-10 10S2 17.5 2 12A10 10 0 0 1 12 2z"></path>
          <path d="M12 6v6l4 2"></path>
        </svg>
        <span>Crops</span>
      </a>

      <a routerLink="/crop-requirements" routerLinkActive="active" (click)="closeSidebar.emit()" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>Crop Requirements</span>
      </a>
    </nav>
  </div>

  <div class="sidebar-footer">
    <button (click)="onLogout()" class="sidebar-logout-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Sign Out</span>
    </button>
  </div>
</aside>
